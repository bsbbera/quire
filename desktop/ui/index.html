<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quire</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Studio is the app. It fills the window; everything else floats over it. -->
<iframe id="frame" title="Quire Studio" hidden></iframe>

<!-- Boot cover: the only thing visible until Studio answers. -->
<div class="cover" id="cover">
  <div class="cover-card">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round">
        <path d="M26.5 41.5 A23.5 23.5 0 0 0 73.5 41.5"/>
        <path d="M34.5 41.5 A15.5 15.5 0 0 0 65.5 41.5"/>
        <path d="M42.5 41.5 A7.5 7.5 0 0 0 57.5 41.5"/>
      </g>
    </svg>
    <b class="wordmark">Quire</b>
    <p id="sub">starting…</p>
    <ul class="steps">
      <li id="stepShim"><span class="dot"></span><span class="step-label">Model shim</span><span class="step-note"></span></li>
      <li id="stepStudio"><span class="dot"></span><span class="step-label">Workbench</span><span class="step-note"></span></li>
      <li id="stepModels"><span class="dot"></span><span class="step-label">Providers</span><span class="step-note"></span></li>
    </ul>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <p class="tiny"><span id="pct">0%</span><span id="elapsed"></span></p>
    <p class="tiny" id="firstRun" hidden>First launch takes longer: the workbench is building its index.</p>
    <div id="notes" class="empty"></div>
  </div>
</div>

<!-- No settings drawer.
     The shell used to carry one: a folder picker, a provider list, images,
     integrations and the updater, floating over the workbench that already had
     pages for most of them. One machine described in two places, and the half
     the user could reach was the wrong half. What actually needed the shell was
     never the panel, only the Tauri calls behind it - restart, and the updater
     - so those stayed and became messages the workbench can send. Everything
     visible lives on a page now: Models & setup.
-->
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
